name: Bug report
description: Report a bug in Velora
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Concrete steps to trigger the bug, plus the command you ran.
      placeholder: |
        1. Run `./scripts/velora.sh dev`
        2. ...
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Distro, Hyprland/Omarchy version, Godot version, GPU/driver, Wayland/X11.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety impact
      description: Does this involve modifying or destroying Omarchy/Hyprland configuration?
      options:
        - label: "Yes, this could affect the user's desktop configuration"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: Paste any error output. If sensitive or very long, trim it.
    validations:
      required: false
